<body>
  <trade-advantage-assessment></trade-advantage-assessment>
  <script>
    (function() {
      'use strict';
      if (customElements.get('trade-advantage-assessment')) return;

      const SCORING_VERSION = "1.3.0-gtmi-combined";

      // ── Original seven questions (unchanged) ──────────────────
      const QUESTIONS = [
        {
          dim: "Export Experience",
          insight: "Companies with a clear export plan tend to perform far better globally than those who approach it ad hoc.",
          text: "Have you exported before?",
          opts: [
            { label: "No, this will be our first shipment.", v: 0 },
            { label: "Yes, a few times, but not routinely.", v: 2 },
            { label: "Yes, we export regularly.", v: 4 },
          ]
        },
        {
          dim: "Market Intelligence",
          insight: "Many businesses want to grow internationally but aren't sure which markets are the best fit for their products.",
          text: "How do you choose your target markets - data or instinct?",
          opts: [
            { label: "We haven't really defined our target markets yet.", v: 0 },
            { label: "We have an idea, but it's not backed by data.", v: 2 },
            { label: "Our markets are chosen based on real data.", v: 4 },
          ],
          extra: [
            { id: "products", label: "What products will you be exporting/importing? <span class='optional-tag'>(optional)</span>", placeholder: "e.g. cotton textiles, auto components" },
            { id: "countries", label: "Which countries or regions are you targeting? <span class='optional-tag'>(optional)</span>", placeholder: "e.g. UAE, Germany, Southeast Asia" },
          ]
        },
        {
          dim: "HS Classification",
          insight: "An incorrect HS Code doesn't just risk a fine, it can trigger real delays at customs.",
          text: "Has your product's HS Code professionally verified?",
          opts: [
            { label: "No, it's never been formally classified.", v: 0 },
            { label: "We classified it ourselves - never verified.", v: 2 },
            { label: "Yes, it's professionally verified.", v: 4 },
          ]
        },
        {
          dim: "Compliance Status",
          insight: "Registrations prove you were compliant once. They don't confirm you still are.",
          text: "Are your trade registrations actively monitored, or just filed and forgotten?",
          opts: [
            { label: "We're missing key registrations.", v: 0 },
            { label: "Registrations are done, but not monitored.", v: 2 },
            { label: "Fully registered and actively monitored.", v: 4 },
          ]
        },
        {
          dim: "Buyer & Supplier Readiness",
          insight: "For many businesses, the biggest challenge isn't paperwork but finding a confirmed buyer.",
          text: "Do you have a confirmed buyer or supplier lined up?",
          opts: [
            { label: "No, we're still looking.", v: 0 },
            { label: "In discussion, nothing confirmed yet.", v: 2 },
            { label: "Yes, confirmed and ready.", v: 4 },
          ]
        },
        {
          dim: "Shipment Timeline",
          insight: "A rushed timeline can turn small gaps into bigger, more expensive problems.",
          text: "When is your next shipment expected to move?",
          opts: [
            { label: "Within 30 days.", v: 0 },
            { label: "1–3 months out.", v: 2 },
            { label: "3+ months out, or nothing planned yet.", v: 4 },
          ]
        },
        {
          dim: "Duty & Cost Optimization",
          insight: "There's often real money to save here, through a Free Trade Agreement or better classification that most companies never check for.",
          text: "Have you ever looked for ways to reduce customs duty on your shipments?",
          opts: [
            { label: "No, never looked into it.", v: 0 },
            { label: "We're aware it's possible, haven't acted.", v: 2 },
            { label: "Yes, we actively optimize duty and cost.", v: 4 },
          ]
        },
      ];

      // ── Capability names (strategic language) ─────────────────
      const CAPABILITY_NAMES = [
        "Global Commercial Readiness",
        "Market Intelligence",
        "Trade Governance",
        "Compliance & Regulatory Capability",
        "Commercial Network Readiness",
        "Operational Readiness",
        "Trade Cost Competitiveness"
      ];

      // ── Star rating mapping ──────────────────────────────────
      function capabilityStars(val) {
        if (val === 0) return 1;
        if (val === 2) return 2;
        if (val === 4) return 4;
        return 0;
      }

      // ── Strategic action mapping (impact & effort) ────────────
      const ACTION_MAP = [
        { 0: { rec: "Design a formal first‑shipment process", impact: "Critical", effort: "Medium" },
          2: { rec: "Move to repeatable export processes", impact: "High", effort: "Medium" },
          4: { rec: "Scale into new markets", impact: "Medium", effort: "Low" } },
        { 0: { rec: "Commission a market prioritisation study", impact: "Critical", effort: "High" },
          2: { rec: "Supplement instincts with trade data", impact: "High", effort: "Medium" },
          4: { rec: "Refine with real‑time analytics", impact: "Medium", effort: "Low" } },
        { 0: { rec: "Engage a trade classification specialist", impact: "Critical", effort: "Medium" },
          2: { rec: "Audit self‑classification; periodic review", impact: "High", effort: "Medium" },
          4: { rec: "Share best practices organisation‑wide", impact: "Medium", effort: "Low" } },
        { 0: { rec: "Obtain mandatory registrations immediately", impact: "Critical", effort: "High" },
          2: { rec: "Set up automated regulatory monitoring", impact: "High", effort: "Medium" },
          4: { rec: "Pursue AEO certification", impact: "High", effort: "Medium" } },
        { 0: { rec: "Accelerate buyer identification", impact: "Critical", effort: "High" },
          2: { rec: "Formalise with letters of intent", impact: "High", effort: "Medium" },
          4: { rec: "Leverage confirmed relationships", impact: "Medium", effort: "Low" } },
        { 0: { rec: "Create pre‑shipment checklist", impact: "High", effort: "Medium" },
          2: { rec: "Close open compliance gaps", impact: "High", effort: "Medium" },
          4: { rec: "Build buffer capacity", impact: "Medium", effort: "Low" } },
        { 0: { rec: "Conduct landed‑cost analysis", impact: "Critical", effort: "Medium" },
          2: { rec: "Formalise duty‑optimisation practice", impact: "High", effort: "Medium" },
          4: { rec: "Benchmark cost structure", impact: "Medium", effort: "Low" } }
      ];

      const IMPACT_WEIGHT = { Critical: 4, High: 3, Medium: 2, Low: 1 };
      const EFFORT_WEIGHT = { High: 3, Medium: 2, Low: 1 };

      function getQuadrant(impactStr, effortStr) {
        const i = IMPACT_WEIGHT[impactStr] || 2;
        const e = EFFORT_WEIGHT[effortStr] || 2;
        if (i >= 3 && e <= 2) return "priority";
        if (i >= 3 && e >= 3) return "strategic";
        if (i <= 2 && e <= 2) return "routine";
        return "longterm";
      }

      // ── Risk & Opportunity Maps ──────────────────────────────
      const RISK_MAP = {
        0:{ title:"Limited Global Commercial Readiness", body:"Without shipment history, first‑shipment risk (documentation errors, customs delay, unexpected cost) is highest. This is the most common cause of early‑stage margin loss." },
        1:{ title:"Underdeveloped Market Intelligence", body:"Entering markets without market‑specific research increases the odds of misjudged demand, regulatory surprises, or wrong‑fit product positioning." },
        2:{ title:"Gaps in Trade Governance", body:"An unverified or self‑assigned HS Code is one of the most common sources of duty overpayment and customs delay worth professional verification before volume increases." },
        3:{ title:"Compliance & Regulatory Exposure", body:"Missing correct registration blocks legal export/import activity outright, this is a hard compliance gate, not a soft risk." },
        4:{ title:"Commercial Network Readiness Gap", body:"Without a confirmed counterparty, timelines, pricing, and shipment planning all remain provisional, this is usually the real bottleneck behind a stalled first shipment." },
        5:{ title:"Operational Readiness Under Pressure", body:"A shipment inside 30 days combined with open gaps elsewhere leaves very little room to fix issues before they become costly, this is worth prioritising immediately." },
        6:{ title:"Untapped Trade Cost Competitiveness", body:"Without a landed cost assessment, margin erosion from avoidable duty exposure typically goes unnoticed until it's material." },
      };
      const OPP_MAP = {
        0:{ title:"Strengthen Commercial Readiness", body:"A structured first‑shipment advisory removes the most common causes of early errors, this compounds into every shipment after it." },
        1:{ title:"Build a Data‑Backed Market Shortlist", body:"Moving from instinct to a verified target‑market list improves conversion and reduces wasted sourcing effort." },
        2:{ title:"Professionalise Trade Governance", body:"A verified classification is both a compliance safeguard and, frequently, a direct duty‑saving opportunity." },
        3:{ title:"Layer on Compliance Monitoring", body:"Registrations alone aren't enough in a changing regulatory environment, ongoing monitoring keeps you ahead of changes rather than reacting to them." },
        4:{ title:"Close Buyer/Supplier Discussions", body:"You're in motion, formalising terms now protects your timeline and pricing before the window narrows." },
        5:{ title:"Use the Runway You Have", body:"With more time before your next shipment, this is the ideal window to close classification, compliance, or market‑research gaps before they become urgent." },
        6:{ title:"Formalise Duty‑Saving Practice", body:"Awareness without action leaves margin on the table, a landed cost assessment converts this into a measurable saving." },
      };

      // ── Maturity Bands ────────────────────────────────────────
      function band(score) {
        if (score <= 40) return {
          key:"emerging", tag:"Emerging", activeStages:[0,1,2], nextStage:3,
          productName:"Launch your first global shipment without financial setbacks.",
          tagline:"Your Global Trade Maturity Index reveals foundational gaps best solved together. TradeLaunch provides a structured PLAN → PREPARE → COMPLY → LAUNCH program.",
          body:"Your answers point to foundational gaps - market clarity, classification, buyer readiness, or registration that are best solved in sequence rather than one at a time. TradeLaunch is built for exactly this.",
          btnLabel:"Start Your Export Journey", btnUrl:"https://www.twconsulting.in/tradelaunch", btnClass:"amber"
        };
        if (score <= 75) return {
          key:"developing", tag:"Developing", activeStages:[3,4], nextStage:4,
          productName:"Expand globally with data‑driven trade strategy.",
          tagline:"You're exporting but running on assumptions in a few areas. TradeIntel gives you continuous visibility across the capabilities that matter most.",
          body:"You have export activity underway, but some of it is running on assumptions rather than ongoing intelligence - duty optimisation, compliance monitoring, or market data. TradeIntel gives you continuous visibility across exactly these areas.",
          btnLabel:"Explore Global Expansion Opportunities", btnUrl:"https://tradeintel.twconsulting.in", btnClass:"teal"
        };
        return {
          key:"established", tag:"Established", activeStages:[4,5], nextStage:5,
          productName:"Become a trusted name in global trade industry.",
          tagline:"Your fundamentals are strong. Authorised Economic Operator (AEO) status is the next lever for speed and credibility.",
          body:"Your fundamentals are strong. The next lever isn't fixing gaps - it's status: AEO recognition compounds your existing strength into faster clearance, lower friction, and enhanced credibility with regulators and partners.",
          btnLabel:"Discuss Your AEO Readiness", btnUrl:"https://tradewindsconsulting.zohobookings.in/#/227983000000036016", btnClass:""
        };
      }

      function computeScore(answers) {
        let total = 0, max = 0;
        QUESTIONS.forEach((q, i) => {
          max += 4;
          const idx = answers[i];
          if (typeof idx === 'number' && q.opts[idx]) total += q.opts[idx].v;
        });
        if (max === 0) return 0;
        return Math.max(0, Math.min(100, Math.round((total / max) * 100)));
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }

        .stage.active .dot{background:hsl(var(--_primary));border-color:hsl(var(--_primary));box-shadow:0 0 0 4px rgba(11,58,92,0.12);}

        footer.tw { margin-top: 48px; text-align: center; font-size: 12px; font-weight: 500; color: hsl(var(--_muted-foreground) / 0.75); }
        footer.tw a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
        footer.tw a:hover { color: hsl(var(--_secondary)); }

        /* Strategic Priority Matrix */
        .matrix-section { margin-top: 18px; }
        .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .matrix-quadrant { border-radius: calc(var(--_radius) + 2px); padding: 14px 12px; font-size: 12px; min-height: 80px; }
        .matrix-quadrant h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
        .matrix-quadrant ul { margin: 0; padding-left: 16px; }
        .matrix-quadrant li { margin-bottom: 4px; line-height: 1.4; }
        .matrix-quadrant.priority { background: hsl(var(--_secondary-soft)); border: 1px solid hsl(var(--_secondary)); }
        .matrix-quadrant.priority h4 { color: hsl(var(--_secondary)); }
        .matrix-quadrant.strategic { background: hsl(var(--_primary) / 0.08); border: 1px solid hsl(var(--_primary)); }
        .matrix-quadrant.strategic h4 { color: hsl(var(--_primary)); }
        .matrix-quadrant.routine { background: hsl(var(--_muted)); border: 1px solid hsl(var(--_border)); }
        .matrix-quadrant.routine h4 { color: hsl(var(--_muted-foreground)); }
        .matrix-quadrant.longterm { background: hsl(var(--_accent-soft) / 0.5); border: 1px solid hsl(var(--_accent) / 0.4); }
        .matrix-quadrant.longterm h4 { color: hsl(var(--_accent)); }

        /* SWOT */
        .swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
        .swot-box { border-radius: calc(var(--_radius) + 2px); padding: 14px 14px; font-size: 13px; }
        .swot-box h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
        .swot-box ul { margin: 0; padding-left: 16px; }
        .swot-box li { margin-bottom: 4px; line-height: 1.4; }
        .swot-strengths { background: hsl(var(--_secondary-soft) / 0.7); border: 1px solid hsl(var(--_secondary)); }
        .swot-strengths h4 { color: hsl(var(--_secondary)); }
        .swot-weaknesses { background: hsl(var(--_accent-soft) / 0.7); border: 1px solid hsl(var(--_accent)); }
        .swot-weaknesses h4 { color: hsl(var(--_accent)); }

        .swot-opportunities h4 { color: hsl(var(--_primary)); }
        .swot-threats { background: hsl(var(--_muted)); border: 1px solid hsl(var(--_border)); }
        .swot-threats h4 { color: hsl(var(--_muted-foreground)); }

        @media (max-width:480px), @container twa (max-width:480px) {
          .matrix-grid, .swot-grid, .capability-grid { grid-template-columns: 1fr; }
          .options { gap:8px; } .opt { padding:12px; } .opt-text { font-size:14px; }
          .stage-name { font-size:8px; } footer.tw { font-size:11px; }
        }
        @media (max-width:768px), @container twa (max-width:768px) {
          .stepper{overflow-x:auto;padding-bottom:8px;}
          .nav-row{flex-direction:column-reverse;align-items:stretch;}
          .nav-row .btn, .nav-row .link-back{width:100%;text-align:center;justify-content:center;}
          .result-cta .actions{flex-direction:column;}
          .result-cta .actions .btn{width:100%;}
          .risk-item, .opp-item{padding:14px;}
          .brandline{flex-wrap:wrap;}
        }
        @media (max-width:360px), @container twa (max-width:360px) {

          .stage-row .connector{top:9px;}
          .stepper .node{width:20px;height:20px;font-size:9.5px;}
          .btn{font-size:13.5px;padding:12px 16px;}
        }
      `;

      function injectFontsOnce() {
        if (document.getElementById('twa-font-link')) return;
        const pre1 = document.createElement('link'); pre1.rel = 'preconnect'; pre1.href = 'https://fonts.googleapis.com';
        const pre2 = document.createElement('link'); pre2.rel = 'preconnect'; pre2.href = 'https://fonts.gstatic.com'; pre2.crossOrigin = 'anonymous';
        const sheet = document.createElement('link'); sheet.id = 'twa-font-link'; sheet.rel = 'stylesheet';
        sheet.href = 'https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap';
        document.head.append(pre1, pre2, sheet);
      }

      class TradeAdvantageAssessment extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.answers = new Array(QUESTIONS.length).fill(null);
          this.extras = { products: "", countries: "" };
          this.current = 0;
        }

        connectedCallback() {
          injectFontsOnce();
          this.shadowRoot.innerHTML = `
            <style>${STYLE}</style>
            <div class="wrap">
              <div class="app-header">
                <a href="https://www.twconsulting.in" target="_blank" rel="noopener noreferrer">
                  <img src="logo.png" alt="Trade Winds Consulting" class="logo-img" />
                </a>
                <div class="header-title-group">
                  <span class="header-title">Trade Advantage Assessment</span>
                </div>
              </div>
              <div class="screen active" id="start">
                <h1>How prepared is your business for <span>global trade</span>?</h1>
                <p class="sub">
                  Answer 7 simple questions to receive your <strong>Global Trade Maturity Index</strong> score,
                  see your strongest capability areas, a strategic priority matrix, and a SWOT analysis.
                </p>
                <button type="button" class="btn" id="beginBtn">Begin Assessment</button>
                <div class="meta-line">7 Questions · ~3 Minutes · Free</div>
              </div>
              <div id="q-container" aria-live="polite"></div>
              <div class="screen" id="results" aria-live="polite"></div>
              <footer class="tw">
                <a href="https://www.twconsulting.in" target="_blank" rel="noopener noreferrer">Trade Winds Consulting</a> - TradeAssess
              </footer>
            </div>
          `;

          this.$start = this.shadowRoot.getElementById('start');
          this.$q = this.shadowRoot.getElementById('q-container');
          this.$results = this.shadowRoot.getElementById('results');

          this.shadowRoot.getElementById('beginBtn').addEventListener('click', () => this.goTo(1));

          // ── Smooth option selection (no re‑render) ──────────
          this.$q.addEventListener('click', (e) => {
            const optBtn = e.target.closest('.opt');
            if (optBtn) {
              const oi = Number(optBtn.dataset.oi);
              this.answers[this.current] = oi;
              this.emit('question_answered', {
                index: this.current,
                dimension: QUESTIONS[this.current].dim,
                value: QUESTIONS[this.current].opts[oi].v
              });

              const allOpts = this.$q.querySelectorAll('.opt');
              allOpts.forEach(o => {
                o.classList.remove('selected');
                o.setAttribute('aria-checked', 'false');
              });
              optBtn.classList.add('selected');
              optBtn.setAttribute('aria-checked', 'true');

              const nextBtn = this.$q.querySelector('[data-action="next"]');
              if (nextBtn) nextBtn.disabled = false;
              return;
            }
            const actionBtn = e.target.closest('[data-action]');
            if (actionBtn) {
              if (actionBtn.dataset.action === 'next') this.nextQ();
              if (actionBtn.dataset.action === 'prev') this.prevQ();
            }
          });

          this.$q.addEventListener('input', (e) => {
            const field = e.target.closest('[data-field]');
            if (field) this.extras[field.dataset.field] = field.value;
          });

          this.$results.addEventListener('click', (e) => {
            const restartBtn = e.target.closest('[data-action="restart"]');
            if (restartBtn) { this.restart(); return; }
            const cta = e.target.closest('a.btn');
            if (cta) this.emit('cta_clicked', { band: this._lastBand, url: cta.getAttribute('href') });
          });
        }

        emit(name, detail) {
          this.dispatchEvent(new CustomEvent(`twa:${name}`, {
            detail: Object.assign({ scoringVersion: SCORING_VERSION }, detail || {}),
            bubbles: true,
            composed: true
          }));
        }

        buildStepper(idx) {
          let html = `<div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${idx+1}" aria-label="Question ${idx+1} of ${QUESTIONS.length}">`;
          QUESTIONS.forEach((_, i) => {
            const cls = i < idx ? 'done' : (i === idx ? 'current' : '');
            html += `<div class="node ${cls}" aria-hidden="true">${i < idx ? '✓' : i+1}</div>`;
            if (i < QUESTIONS.length-1) html += `<div class="seg ${i < idx ? 'done':''}" aria-hidden="true"></div>`;
          });
          return html + '</div>';
        }

        renderQuestion(i) {
          const q = QUESTIONS[i];
          let optsHtml = '';
          q.opts.forEach((o, oi) => {
            const sel = this.answers[i] === oi;
            optsHtml += `<button type="button" class="opt ${sel?'selected':''}" data-oi="${oi}" role="radio" aria-checked="${sel}">
              <span class="mark" aria-hidden="true"></span><span class="opt-text">${escapeHtml(o.label)}</span>
            </button>`;
          });

          let extraHtml = '';
          if (q.extra) {
            extraHtml = '<div class="extra-fields">';
            q.extra.forEach(f => {
              extraHtml += `<div class="fld">
                <label for="fld-${f.id}">${f.label}</label>
                <input type="text" id="fld-${f.id}" data-field="${f.id}" placeholder="${escapeHtml(f.placeholder)}" value="${escapeHtml(this.extras[f.id]||'')}" autocomplete="off">
              </div>`;
            });
            extraHtml += '</div>';
          }

          const insightHtml = q.insight ? `<div class="q-insight">${escapeHtml(q.insight)}</div>` : '';

          this.$q.innerHTML = `<div class="screen active">
            ${this.buildStepper(i)}
            <div class="card">
              <div class="q-dim">Insight ${i+1} of ${QUESTIONS.length} · ${escapeHtml(q.dim)}</div>
              ${insightHtml}
              <div class="q-text">${escapeHtml(q.text)}</div>
              <div class="options" role="radiogroup" aria-label="${escapeHtml(q.text)}">${optsHtml}</div>
              ${extraHtml}
              <div class="nav-row">
                <button type="button" class="link-back" ${i===0?'disabled':''} data-action="prev">← Back</button>
                <button type="button" class="btn" data-action="next" ${this.answers[i]===null?'disabled':''}>
                  ${i === QUESTIONS.length-1 ? 'See My Results' : 'Next'}
                </button>
              </div>
            </div>
          </div>`;
        }

        nextQ() {
          if (this.answers[this.current] === null) return;
          if (this.current < QUESTIONS.length - 1) {
            this.current++;
            this.renderQuestion(this.current);
          } else {
            this.showResults();
          }
        }

        prevQ() {
          if (this.current > 0) {
            this.current--;
            this.renderQuestion(this.current);
          } else {
            this.goTo(0);
          }
        }

        goTo(step) {
          this.$start.classList.remove('active');
          this.$q.innerHTML = '';
          this.$results.classList.remove('active');
          if (step === 1) {
            this.current = 0;
            this.emit('started', {});
            this.renderQuestion(0);
          } else {
            this.$start.classList.add('active');
          }
        }

        showResults() {
          this.$q.innerHTML = '';
          const score = computeScore(this.answers);
          const b = band(score);
          this._lastBand = b.key;
          const circumference = 2 * Math.PI * 78;
          const offset = circumference - (score/100)*circumference;

          // Capability star grid
          let capRowsHtml = '';
          this.answers.forEach((a,i) => {
            const opt = QUESTIONS[i].opts[a];
            if (!opt) return;
            const stars = capabilityStars(opt.v);
            const filled = '★'.repeat(stars);
            const empty = '☆'.repeat(5 - stars);
            capRowsHtml += `<div class="cap-row">
              <span class="cap-name">${escapeHtml(CAPABILITY_NAMES[i])}</span>
              <span class="cap-stars" aria-label="${stars} out of 5 stars">${filled}${empty}</span>
            </div>`;
          });

          // Strategic Priority Matrix
          const quadrants = { priority: [], strategic: [], routine: [], longterm: [] };
          this.answers.forEach((a,i) => {
            const opt = QUESTIONS[i].opts[a];
            if (!opt) return;
            const action = ACTION_MAP[i] && ACTION_MAP[i][opt.v];
            if (!action) return;
            const quadrant = getQuadrant(action.impact, action.effort);
            quadrants[quadrant].push({ capability: CAPABILITY_NAMES[i], rec: action.rec, impact: action.impact, effort: action.effort });
          });

          const quadNames = { priority:"Priority Actions", strategic:"Strategic Initiatives", routine:"Routine Improvements", longterm:"Long‑Term Considerations" };
          let matrixHtml = '<div class="matrix-section"><div class="sec-title">Strategic Priority Matrix (Impact vs. Effort)</div><div class="matrix-grid">';
          Object.keys(quadrants).forEach(key => {
            const items = quadrants[key];
            matrixHtml += `<div class="matrix-quadrant ${key}"><h4>${quadNames[key]}</h4>`;
            if (items.length === 0) matrixHtml += '<p style="margin:0; opacity:0.7; font-style:italic;">No actions in this quadrant</p>';
            else {
              matrixHtml += '<ul>';
              items.forEach(item => matrixHtml += `<li><strong>${escapeHtml(item.capability)}</strong>: ${escapeHtml(item.rec)}</li>`);
              matrixHtml += '</ul>';
            }
            matrixHtml += '</div>';
          });
          matrixHtml += '</div></div>';

          // SWOT Analysis
          const strengths = [], weaknesses = [], opportunities = [], threats = [];
          this.answers.forEach((a,i) => {
            const cap = CAPABILITY_NAMES[i];
            const opt = QUESTIONS[i].opts[a];
            if (!opt) return;
            if (opt.v === 4) strengths.push(cap);
            else if (opt.v === 0) weaknesses.push(cap);
            else if (opt.v === 2) opportunities.push(cap + " (partial capability)");
          });
          if (this.answers[5] !== null && QUESTIONS[5].opts[this.answers[5]].v === 0) threats.push("Tight shipment timeline (<30 days) may exacerbate capability gaps");
          if (this.answers[2] !== null && QUESTIONS[2].opts[this.answers[2]].v === 0) threats.push("Unverified HS classification exposes to customs delays and penalties");
          if (this.answers[3] !== null && QUESTIONS[3].opts[this.answers[3]].v === 0) threats.push("Missing registrations block legal import/export activity");

          let swotHtml = '<div class="sec-title">SWOT Analysis</div><div class="swot-grid">';
          swotHtml += `<div class="swot-box swot-strengths"><h4>Strengths</h4><ul>${strengths.length ? strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('') : '<li>No distinct strengths yet, build from core actions</li>'}</ul></div>`;
          swotHtml += `<div class="swot-box swot-weaknesses"><h4>Weaknesses</h4><ul>${weaknesses.length ? weaknesses.map(w => `<li>${escapeHtml(w)}</li>`).join('') : '<li>No critical weaknesses identified</li>'}</ul></div>`;
          swotHtml += `<div class="swot-box swot-opportunities"><h4>Opportunities</h4><ul>${opportunities.length ? opportunities.map(o => `<li>${escapeHtml(o)}</li>`).join('') : '<li>All capabilities are either strong or fully managed</li>'}</ul></div>`;
          swotHtml += `<div class="swot-box swot-threats"><h4>Threats</h4><ul>${threats.length ? threats.map(t => `<li>${escapeHtml(t)}</li>`).join('') : '<li>No immediate external threats detected</li>'}</ul></div>`;
          swotHtml += '</div>';

          // Risks & Opportunities (unchanged)
          let risksHtml = '', oppsHtml = '';
          this.answers.forEach((a,i) => {
            const opt = QUESTIONS[i].opts[a];
            if (!opt) return;
            const val = opt.v;
            if (val === 0 && RISK_MAP[i]) risksHtml += `<details class="risk-item"><summary><span class="flag" aria-hidden="true">!</span><span class="item-title">${escapeHtml(RISK_MAP[i].title)}</span><span class="chev" aria-hidden="true">▾</span></summary><div class="item-body">${escapeHtml(RISK_MAP[i].body)}</div></details>`;
            else if (val === 2 && OPP_MAP[i]) oppsHtml += `<details class="opp-item"><summary><span class="flag" aria-hidden="true">↑</span><span class="item-title">${escapeHtml(OPP_MAP[i].title)}</span><span class="chev" aria-hidden="true">▾</span></summary><div class="item-body">${escapeHtml(OPP_MAP[i].body)}</div></details>`;
          });
          if (!risksHtml) risksHtml = `<div class="risk-item static"><div class="flag" style="background:hsl(var(--_secondary-soft));color:hsl(var(--_secondary));" aria-hidden="true">✓</div><div><div class="item-title">No critical risk flags</div><div class="item-body">Your capability fundamentals are in place - the priority now is optimisation, not repair.</div></div></div>`;
          if (!oppsHtml) oppsHtml = `<div class="opp-item static"><div class="flag" aria-hidden="true">✓</div><div><div class="item-title">Maintain and monitor</div><div class="item-body">No mid‑tier gaps flagged - focus on sustaining current practice and monitoring for regulatory change.</div></div></div>`;

          // Roadmap
          const stageNames = ["ACCESS","DESIGN","ENABLE","EXECUTE","OPTIMIZE","ELEVATE"];
          let stagesHtml = '<div class="stage-row"><div class="connector" aria-hidden="true"></div>';
          stageNames.forEach((name,i) => {
            let cls = '';
            if (b.activeStages.includes(i)) cls = 'active';
            if (i === b.nextStage) cls = 'next';
            stagesHtml += `<div class="stage ${cls}"><div class="dot" aria-hidden="true"></div><div class="stage-name">${name}</div></div>`;
          });
          stagesHtml += '</div>';

          let personalLine = '';
          if (this.extras.products || this.extras.countries) {
            let phrase = '';
            if (this.extras.products && this.extras.countries) phrase = `for <b>${escapeHtml(this.extras.products)}</b> into <b>${escapeHtml(this.extras.countries)}</b>`;
            else if (this.extras.products) phrase = `for <b>${escapeHtml(this.extras.products)}</b>`;
            else phrase = `into <b>${escapeHtml(this.extras.countries)}</b>`;
            personalLine = `<div class="personal-line">Reflects your plans ${phrase}.</div>`;
          }

          this.$results.innerHTML = `
            <div class="brandline"><span class="dot"></span>Global Trade Maturity Index</div>
            <div class="result-card">
              <div class="result-top">
                <div class="gauge-wrap">
                  <svg viewBox="0 0 180 180" role="img" aria-label="Global Trade Maturity Index: ${score} out of 100">
                    <circle cx="90" cy="90" r="78" fill="none" stroke="hsl(var(--_border))" stroke-width="14"/>
                    <circle cx="90" cy="90" r="78" fill="none" stroke="hsl(var(--_primary))" stroke-width="14" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 90 90)" />
                  </svg>
                  <div class="score-num" aria-hidden="true"><div class="n">${score}</div></div>
                </div>
                <div class="result-top-text">
                  <div class="band-tag ${b.key}">${b.tag}</div>
                  ${personalLine}
                </div>
              </div>
              <div class="capability-grid">${capRowsHtml}</div>
              ${matrixHtml}
              ${swotHtml}
              <div class="result-divider"></div>
              <div class="result-cta">
                <div class="k">Recommended Next Step</div>
                <h3>${escapeHtml(b.productName)}</h3>
                <p class="tagline">${escapeHtml(b.tagline)}</p>
                <div class="actions">
                  <a class="btn ${b.btnClass}" href="${b.btnUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(b.btnLabel)}</a>
                  <button type="button" class="btn secondary" data-action="restart">Retake Assessment</button>
                </div>
              </div>
            </div>
            <details class="full-breakdown">
              <summary>
                <span>See Full Breakdown - Risks, Opportunities &amp; Roadmap</span>
                <span class="chev" aria-hidden="true">▾</span>
              </summary>
              <div class="breakdown-inner">
                <p style="font-size:13.5px;line-height:1.6;color:hsl(var(--_muted-foreground));margin:0 0 24px;">${escapeHtml(b.body)}</p>
                <div class="sec-title">Top Risks</div>
                ${risksHtml}
                <div class="sec-title">Growth Opportunities</div>
                ${oppsHtml}
                <div class="sec-title">Your Position on the Trade Advantage System</div>
                <div class="roadmap">${stagesHtml}</div>
              </div>
            </details>
          `;

          this.$results.classList.add('active');
          this.$results.scrollIntoView({ behavior: 'smooth', block: 'start' });
          this.emit('completed', { score, band: b.key });

          const breakdownEl = this.$results.querySelector('.full-breakdown');
          if (breakdownEl) {
            const onToggle = () => {
              if (breakdownEl.open) {
                this.emit('breakdown_expanded', { band: b.key });
                breakdownEl.removeEventListener('toggle', onToggle);
              }
            };
            breakdownEl.addEventListener('toggle', onToggle);
          }

          const ctaEl = this.$results.querySelector('.result-cta a.btn');
          if (ctaEl && 'IntersectionObserver' in window) {
            const io = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  this.emit('cta_visible', { band: b.key });
                  io.disconnect();
                }
              });
            }, { threshold: 0.6 });
            io.observe(ctaEl);
          }
        }

        restart() {
          this.answers = new Array(QUESTIONS.length).fill(null);
          this.extras = { products:"", countries:"" };
          this.current = 0;
          this.$results.classList.remove('active');
          this.goTo(0);
        }
      }

      try {
        customElements.define('trade-advantage-assessment', TradeAdvantageAssessment);
      } catch (err) {
        console.error('Trade Advantage Assessment failed to register:', err);
      }
    })();
  </script>
</body>
</html>
